name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The three build steps below deliberately continue on error: lint and the
      # APK build still run when unit tests fail, and the diagnostics step turns
      # every failure into check-run annotations. A final gate step fails the job.
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee unit-tests.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace 2>&1 | tee lint.log

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee assemble.log

      - name: Report APK contents
        if: steps.assemble.outcome == 'success'
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK: $APK"
          unzip -l "$APK" > apk-contents.txt
          cat apk-contents.txt
          grep -E 'lib/|\.so$' apk-contents.txt || echo "No native libraries (no lib/ folder) in the APK"

      - name: Publish CI diagnostics
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
        run: python3 .github/scripts/ci_diagnostics.py

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: sairen-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Fail if any required step failed
        if: always()
        run: |
          echo "unit_tests=${{ steps.unit_tests.outcome }} lint=${{ steps.lint.outcome }} assemble=${{ steps.assemble.outcome }}"
          if [ "${{ steps.unit_tests.outcome }}" != "success" ] ||
             [ "${{ steps.lint.outcome }}" != "success" ] ||
             [ "${{ steps.assemble.outcome }}" != "success" ]; then
            echo "One or more required steps failed."
            exit 1
          fi
